apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tells Kustomize to inherit the core deployment and service from the base folder
resources:
  - ../../base

# Overwrites the image reference dynamically
images:
  - name: docker.io/placeholder/devsecops-app
    newName: onkarrajput/devsecops-app  # ◄ Replace "onkarrajput" with your actual Docker Hub username
    newTag: latest                      # ◄ The pipeline will automatically overwrite this tag
