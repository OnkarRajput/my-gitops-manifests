apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  fluent-bit.conf: |
    [SERVICE]
        daemon Off
        flush 1
        log_level info
        parsers_file parsers.conf
        plugins_file plugins.conf
        http_server On
        http_listen 0.0.0.0
        http_port 2020
        health_check On
    
    [INPUT]
        name tail
        path /var/log/containers/*.log
        parser docker
        tag kube.*
        refresh_interval 5
        mem_buf_limit 50MB
        skip_long_lines On
        db /var/log/flb_kube.db
    
    [FILTER]
        name kubernetes
        match kube.*
        kube_url https://kubernetes.default.svc:443
        kube_ca_file /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kube_token_file /var/run/secrets/kubernetes.io/serviceaccount/token
        kube_tag_prefix kube.var.log.containers.
        merge_log On
        keep_log Off
        k8s-logging.parser On
        k8s-logging.exclude On
        labels On
        annotations On
    
    [OUTPUT]
        name loki
        match *
        host loki.observability.svc.cluster.local
        port 3100
        http_user
        http_passwd
        tenant_id
        labels job=fluent-bit
        label_keys namespace, pod_name, container_name
        line_format json
  
  parsers.conf: |
    [PARSER]
        name docker
        format json
        time_key time
        time_format %Y-%m-%dT%H:%M:%S.%L%z
        time_keep On
    
    [PARSER]
        name syslog-rfc3164
        format regex
        regex /^(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>.*?)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$/
        time_key time
        time_format %b %d %H:%M:%S
